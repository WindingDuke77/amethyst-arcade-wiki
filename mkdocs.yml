site_name: Amethyst Arcade Wiki
site_url: https://wiki.amethystarcade.games/
site_description: Guides, numbers and reference for Amethyst Arcade games, starting with Rogue Roller.
repo_url: https://github.com/WindingDuke77/amethyst-arcade-wiki
repo_name: Suggest a change
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  logo: assets/amethyst_arcade_icon.svg
  favicon: assets/amethyst_arcade_icon_512.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/solid/lightbulb
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - toc.integrate

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/daily.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/dQrpnsb2r9
      name: Amethyst Arcade Discord
    - icon: fontawesome/brands/github
      link: https://github.com/WindingDuke77/amethyst-arcade-wiki
      name: Wiki source

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Rogue Roller:
      - rogue-roller/index.md
      - The basics: rogue-roller/basics.md
      - Shop upgrades: rogue-roller/shop-upgrades.md
      - Gate perks and Spark: rogue-roller/gate-perks.md
      - Meta tree: rogue-roller/meta-tree.md
      - Forge: rogue-roller/forge.md
      - Daily challenges: rogue-roller/daily-challenges.md
      - Badges: rogue-roller/badges.md
      - Cosmetics: rogue-roller/cosmetics.md
      - Store: rogue-roller/store.md
      - Biomes: rogue-roller/biomes.md
  - Suggest a change: suggest-a-change.md
